<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>3D展厅 | 门楼层记</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root{--red: #B8382E; --gray: #6B5B4F; --green: #4A6B5A; --gold: #C9A86C; --cream: #F5F1E8; --ink: #2C2420; --line: rgba(107,91,79,0.12);}
*{margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
html{-webkit-text-size-adjust: 100%;}
body{font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #E6DFD0; color: var(--ink);}
a{color: inherit; text-decoration: none;}
button{font-family: inherit; border: none; background: none; cursor: pointer; color: inherit;}

.app{max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; background: var(--cream); position: relative; display: flex; flex-direction: column;
     padding-bottom: calc(58px + env(safe-area-inset-bottom)); box-shadow: 0 0 40px rgba(0,0,0,0.12); overflow: hidden;}

/* 顶部栏 */
.top{flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; height: calc(52px + env(safe-area-inset-top));}
.back{width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--gray);}
.top h1{font-size: 17px; font-weight: 700; letter-spacing: 1px;}
.top .side{min-width: 56px; text-align: right; font-size: 13px; color: var(--green);}

/* 3D 视图 */
.stage{flex: 1 1 auto; min-height: 200px; position: relative; margin: 0 12px; border-radius: 20px; overflow: hidden; background: radial-gradient(#ffffff, #e2ddd3);}
model-viewer{width: 100%; height: 100%; outline: none; --poster-color: transparent;}
.hint{position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 11px; color: #8a7f76; background: rgba(255,255,255,0.8); padding: 3px 12px; border-radius: 12px; pointer-events: none;}

/* 信息面板 */
.sheet{flex: 0 0 auto; max-height: 46%; overflow-y: auto; background: #fff; margin-top: 12px; padding: 18px 18px 16px; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(107,91,79,0.1);}
.gate-title{display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 19px; color: var(--gray);}
.demo-badge{font-size: 11px; background: var(--red); color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: 400;}
.audio-section{margin: 12px 0; padding: 10px 12px; background: #f9f6f0; border-radius: 12px; display: flex; flex-direction: column; gap: 5px;}
.audio-label{font-size: 12px; color: var(--gray); font-weight: 700;}
audio{width: 100%; height: 36px;}
.desc-content{color: #444; line-height: 1.85; font-size: 14px; white-space: pre-wrap;}
.section-header{font-weight: 700; color: var(--green); margin-top: 12px; display: block; border-left: 3px solid var(--green); padding-left: 8px; margin-bottom: 4px;}
.actions{display: flex; gap: 10px; margin-top: 16px;}
.btn{flex: 1; padding: 13px 0; border-radius: 24px; font-size: 15px; font-weight: 700; text-align: center;}
.btn.main{color: #fff; background: linear-gradient(135deg, #A93027, #E0733B); box-shadow: 0 6px 14px rgba(184,56,46,0.3);}
.btn.sub{color: var(--gray); background: var(--cream);}

/* 底部标签栏 */
.tabbar{position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 50; display: flex;
        background: rgba(255,255,255,0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--line); padding: 7px 0 calc(7px + env(safe-area-inset-bottom));}
.tab{flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #9a9088;}
.tab svg{width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;}
.tab.active{color: var(--red); font-weight: 600;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="back" aria-label="返回">‹</button>
    <h1>3D展厅</h1>
    <a class="side" href="map.html?mode=free">看地图</a>
  </header>

  <div class="stage">
    <model-viewer id="gate-viewer" src="demo.glb" auto-rotate camera-controls shadow-intensity="1" ar loading="eager" interaction-prompt="auto"></model-viewer>
    <span class="hint">单指旋转 · 双指缩放</span>
  </div>

  <section class="sheet">
    <h2 class="gate-title">
      <span id="m-title">金柱大门 · 数字化档案</span>
      <span class="demo-badge">技术原型展示</span>
    </h2>

    <div class="audio-section">
      <span class="audio-label">🎧 听·胡同里的金柱门往事</span>
      <audio id="gate-audio" src="n3.mp3" controls></audio>
    </div>

    <div id="m-desc" class="desc-content"></div>

    <div class="actions">
      <button class="btn sub" id="back2">返回地图</button>
      <a class="btn main" href="choose.html">开启漫步路线</a>
    </div>
  </section>
</div>

<nav class="tabbar">
  <a class="tab" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首页
  </a>
  <a class="tab" href="choose.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>游览
  </a>
  <a class="tab active" href="gate-3d.html">
    <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>3D展厅
  </a>
  <a class="tab" href="route.html">
    <svg viewBox="0 0 24 24"><path d="M5 22V3"/><path d="M5 4h12l-2 4 2 4H5"/></svg>我的路线
  </a>
  <a class="tab" href="about.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>关于
  </a>
</nav>

<script>
// 解析网址参数
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

// 内容数据库：金柱大门作为终极兜底内容
const db = {
  "N3": {
    title: "13号院 · 金柱大门",
    audio: "n3.mp3",
    desc: `金柱大门属于屋宇式大门，门扇设置在中柱与前檐柱之间的金柱上。相对于广亮大门宽绰的门前空间，金柱大门的门前空间较少，其形制等级低于广亮大门。\n\n<span class="section-header">文化典故：分寸之间</span>\n明嘉靖年间，西四胡同有位五品官建宅，工匠问门制，他指着金柱说：“门扉安此处，外浅内深——少张扬，多自省。”门成，刻“静以修身”。后来人见金柱门皆道：这门不在阔气，在分寸。\n\n<span class="section-header">胡同记忆：打水的故事</span>\n家里的自来水不出水，要去36号院打水。老师家访时正好看见我去拎水，第二天在全班表扬。那时候冬天窗户上都是冰花，中午才化。洗澡还要去领澡票。\n\n<span class="section-header">胡同记忆：邻居丁阿姨</span>\n邻居丁阿姨总说自己“没啥可讲”，但大家记她唱歌识谱，自带文艺气质。国庆演出时，她清亮的歌声回荡在整条胡同里，那是胡同里最动听的声音。`
  },
  "B1": { title: "无问西东 (北155号)", audio: "n3.mp3", desc: "门楼文化的商业转译点。通过 3D 展示现代精酿空间与传统门楼结构的共生美学。" },
  "N1": { title: "圣祚隆长寺山门", audio: "n3.mp3", desc: "明代山门。随墙门形制，内置乾隆诗碑的数字化复原展示。" },
  "N2": { title: "马福祥宅 11 号院", audio: "n3.mp3", desc: "广亮大门典型。通过 3D 拆解可清晰查看门簪、雀替及极其考究的牡丹砖雕。" }
};

// 核心逻辑：如果找不到 ID 或没有 ID，统一指向 N3
let content = db[id] ? db[id] : db["N3"];

// 渲染标题和文字
document.getElementById('m-title').innerHTML = content.title;
document.getElementById('m-desc').innerHTML = content.desc;

// 强制加载音频
const player = document.getElementById('gate-audio');
player.src = content.audio;

// 强制加载模型
document.getElementById('gate-viewer').src = "demo.glb";

// 返回：有来源页则回退，否则去全部景点地图
function goBack() {
  if (document.referrer && history.length > 1) history.back();
  else location.href = 'map.html?mode=free';
}
document.getElementById('back').addEventListener('click', goBack);
document.getElementById('back2').addEventListener('click', goBack);
</script>
</body>
</html>
