<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>3D展厅 | 门楼层记</title>

<style>
:root{--red: #B8382E; --gray: #6B5B4F; --green: #4A6B5A; --gold: #C9A86C; --cream: #F5F1E8; --ink: #2C2420; --line: rgba(107,91,79,0.12);}
*{margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
html{-webkit-text-size-adjust: 100%;}
body{font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #E6DFD0; color: var(--ink);}
a{color: inherit; text-decoration: none;}
button{font-family: inherit; border: none; background: none; cursor: pointer; color: inherit;}

.app{max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; background: var(--cream); position: relative; display: flex; flex-direction: column;
     padding-bottom: calc(58px + env(safe-area-inset-bottom)); box-shadow: 0 0 40px rgba(0,0,0,0.12); overflow: hidden;}

/* 顶部栏 */
.top{flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; height: calc(52px + env(safe-area-inset-top));}
.back{width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--gray);}
.top h1{font-size: 17px; font-weight: 700; letter-spacing: 1px;}
.top .side{min-width: 56px; text-align: right; font-size: 13px; color: var(--green);}

/* 3D 视图 */
.stage{flex: 1 1 auto; min-height: 200px; position: relative; margin: 0 12px; border-radius: 20px; overflow: hidden; background: radial-gradient(#ffffff, #e2ddd3);}
model-viewer{width: 100%; height: 100%; outline: none; --poster-color: transparent;}
.model-state{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;color:#6B5B4F;font-size:14px;line-height:1.6;pointer-events:none;}
.model-state[hidden],model-viewer[hidden]{display:none;}
.model-state::before{content:"";width:48px;height:48px;background:url('assets/branding/menlou-emblem.png') center/contain no-repeat;}
.hint{position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 11px; color: #8a7f76; background: rgba(255,255,255,0.8); padding: 3px 12px; border-radius: 12px; pointer-events: none;}

/* 信息面板 */
.sheet{flex: 0 0 auto; max-height: 46%; overflow-y: auto; background: #fff; margin-top: 12px; padding: 18px 18px 16px; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(107,91,79,0.1);}
.model-picker{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--gray);font-size:13px;}
.model-picker select{min-width:0;flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#f9f6f0;color:var(--ink);font:inherit;}
.gate-title{display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 19px; color: var(--gray);}
.demo-badge{font-size: 11px; background: var(--red); color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: 400;}
.audio-section{margin: 12px 0; padding: 10px 12px; background: #f9f6f0; border-radius: 12px; display: flex; flex-direction: column; gap: 5px;}
.audio-label{font-size: 12px; color: var(--gray); font-weight: 700;}
audio{width: 100%; height: 36px;}
.desc-content{color: #444; line-height: 1.85; font-size: 14px; white-space: pre-wrap;}
.section-header{font-weight: 700; color: var(--green); margin-top: 12px; display: block; border-left: 3px solid var(--green); padding-left: 8px; margin-bottom: 4px;}
.actions{display: flex; gap: 10px; margin-top: 16px;}
.btn{flex: 1; padding: 13px 0; border-radius: 24px; font-size: 15px; font-weight: 700; text-align: center;}
.btn.main{color: #fff; background: linear-gradient(135deg, #A93027, #E0733B); box-shadow: 0 6px 14px rgba(184,56,46,0.3);}
.btn.sub{color: var(--gray); background: var(--cream);}

/* 底部标签栏 */
.tabbar{position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 50; display: flex;
        background: rgba(255,255,255,0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--line); padding: 7px 0 calc(7px + env(safe-area-inset-bottom));}
.tab{flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #9a9088;}
.tab svg{width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;}
.tab.active{color: var(--red); font-weight: 600;}

/* 印章提示 */
.stamp-toast{position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); transform: translate(-50%, -140%); z-index: 200; display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 26px; background: rgba(39,64,47,0.96); color: #F3E3B8; font-size: 13px; box-shadow: 0 8px 22px rgba(0,0,0,0.3); transition: transform 0.4s cubic-bezier(.2,.9,.3,1.2); max-width: 92%;}
.stamp-toast.show{transform: translate(-50%, 0);}
.stamp-toast .sq{flex: 0 0 30px; height: 30px; border-radius: 50%; border: 1.5px solid #E8CF8E; display: flex; align-items: center; justify-content: center;}
.stamp-toast .sq svg{width: 18px; height: 18px;}
.stamp-toast b{color: #fff;}
.stamp-toast a{color: #E8CF8E; text-decoration: underline; white-space: nowrap;}
</style>

<script>
// 解析网址参数
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

// 内容数据库：只为已核对的点位展示对应档案
const db = {
  "N3": {
    title: "三条31号 · 金柱大门",
    audio: "n3.mp3",
    desc: `<span class="section-header">特点与历史</span>金柱大门是北京四合院中等级较高的屋宇式宅门，外观与广亮大门相似。两者的关键区别在门扇位置：金柱大门没有中柱，门扇设在外金柱处，门外空间较浅、门内空间较深。\n\n<span class="section-header">核心形制</span>门屋构造不设中柱，门扇立在外金柱位置；门外空间约占四分之一，门内约占四分之三。\n\n<span class="section-header">关键尺寸</span>规模通常小于广亮大门，门口也较窄，有的仅占半开间。门扉相较广亮大门向外移动一米多，开在院门的“金柱”位置。\n\n<span class="section-header">木构架</span>一般采用五檩前出廊式，个别采用七檩前后廊式；平面列三排或四排柱，金柱上承三架梁或五架梁，檐柱与金柱间施穿插枋或抱头梁。`
  },
  "N2": { title: "马福祥故居 · 广亮大门", audio: "", desc: `<span class="section-header">特点与历史</span>广亮大门是北京传统四合院中等级较高的屋宇式大门，常见于有一定品级的官宦宅院。门扉开在门庑中柱位置，将门洞一分为二，形成宽敞明亮的门前过道。西四北三条11号院的大门保留这一形制。\n\n<span class="section-header">核心形制</span>门扇设于门庑中柱，将门庑均分为二，门前空间宽敞。\n\n<span class="section-header">关键尺寸</span>通常占倒座房东端第二间；进深、台基和柱高均明显大于倒座房，屋面沿街凸显。\n\n<span class="section-header">木构架</span>一般为五檩中柱式，六根柱包括前后檐柱和中柱；中柱上承脊檩，将五架梁分为双步梁与单步梁。\n\n<span class="section-header">院落与街区记忆</span>马福祥故居为坐北朝南的中型四合院，分东西两路，西为住宅、东为花园，院内曾有假山与爬山游廊。民国时期马福祥曾寓居于此，处理蒙藏事务、研读典籍；如今宅院用作幼儿园，见证院落功能随时代变化。` },
  "N39": { title: "程砚秋故居 · 如意门", audio: "", desc: `<span class="section-header">故居介绍</span>程砚秋故居位于西四北三条39号，旧称报子胡同18号，是北京市第三批市级文物保护单位。宅院为坐北朝南的三进四合院，东南角开如意门，院内有影壁与垂花门。前院北房曾作“御霜书斋”，后院为居所。程砚秋1938年购置此院，居住至1958年逝世。故居为私产，不对外开放。\n\n<span class="section-header">书斋记忆</span>前院北房是程砚秋的书房“御霜簃”。家人回忆，书房里有沙发、茶几、紫檀屏风、书柜和线装《四库全书》，正梁悬挂题字匾额。每年入秋，程砚秋会在书房插上桂花，满屋清香，访客常在这里相聚。` },
  "N5": { title: "三条41—43号 · 蛮子门", audio: "", desc: `<span class="section-header">特点与历史</span>蛮子门的等级低于金柱大门、高于如意门，多见于富裕人家。门扉直接装在前檐檐柱之间，门外没有廊子和停留空间。关于名称，民间流传一种说法：南方来京的商人出于安全考虑，将门扉设在最外檐，避免给盗贼留下藏身处。\n\n<span class="section-header">核心形制</span>槛框、余塞板与门扉安装在前檐檐柱之间，门扉外没有容身空间。\n\n<span class="section-header">关键尺寸与木构架</span>门口宽高依门光尺吉尺寸；门内过道空间约为一间房屋进深。一般采用五檩硬山式，平面四柱，柱头置五架梁。` },
  "N11": { title: "三条23号 · 西洋门", audio: "", desc: `<span class="section-header">特点与历史</span>西洋门是清代中西文化交融的产物，在传统院落中融入西方建筑构图手法，通常见于清中期以后。西四北三条保留有此类门楼，体现街区建筑风格的多样性。\n\n<span class="section-header">核心形制</span>单开间砖柱结构，居中设门洞；砖柱常饰二至三重冰盘檐，墙面装饰线与横额结合，门框沿用中式做法。\n\n<span class="section-header">建筑细节</span>冰盘檐将砖柱分成数段，并与柱间砖墙上的装饰线相接；冲天柱式砖柱中间顶墙常做成阶梯形。` },
  "N10": { title: "三条45号 · 随墙门", audio: "", desc: `<span class="section-header">特点与历史</span>随墙门直接开设在院墙上，规模较小、形制简洁，常作院落后门或旁门。常见形式是在墙上安装较薄的实榻屏门。\n\n<span class="section-header">核心形制</span>没有独立屋宇，门洞直接顺墙开设；常见小门楼会以短山墙、屋顶、正脊和花草砖装饰，营造屋宇效果。\n\n<span class="section-header">关键尺寸与构造</span>屏门多为约6厘米厚的实木门扇，门高按门口确定，单扇宽度按门口宽度并计入掩缝、错口。门框直接嵌入墙体，没有独立木构架。` },
  "N1": { title: "圣祚隆长寺", audio: "", desc: `<span class="section-header">历史沿革</span>圣祚隆长寺位于西城区西四北三条3号，始建于明万历四十五年（1617），原为汉经厂外厂，清乾隆二十一年（1756）重修。寺院坐北朝南，原有山门、天王殿、大千佛殿、后殿及钟鼓楼等建筑。现存山门、残殿与古碑，院内留有明清彩画原迹。\n\n<span class="section-header">寺院记忆</span>大千佛殿曾供奉高近五米的铜制五方佛，莲瓣铸有小佛像，称“千佛绕毗卢”。乾隆重修寺院后题写御制诗并刻碑纪事。寺院近代一度作民居、仓库，后经腾退清理，古建重见天日。五方佛现迁至法源寺保存。` },
  "N4": { title: "三条35—37号 · 广亮大门", audio: "", desc: `西四北三条保存的广亮大门形制点位。其门扇设于门庑中柱，门庑均分为二，形成宽敞明亮的门前空间。广亮大门通常进深较大、台基和柱身较高，整体庄重醒目。` },
  "L5": { title: "傅增湘故居 · 藏园", audio: "", desc: `<span class="section-header">历史介绍</span>傅增湘故居又名藏园，位于西四北五条7号。1918年傅增湘购得此院，修建东西两路四合院，并设藏书楼“双鉴楼”。他曾在此收藏、校勘古籍，藏书最多达二十余万卷。故居后来曾作电影研究所办学场所，现为民居，园林景观多已不存。\n\n<span class="section-header">藏书故事</span>傅增湘因藏有两部珍贵《资治通鉴》善本，将藏书楼命名为“双鉴楼”。张伯驹、张元济等学者曾来访书论学。傅增湘还曾奔走促成张伯驹购藏《平复帖》，使这件珍贵文物免于流失海外。` },
  "W1": { title: "中央电影局旧址", audio: "", desc: `<span class="section-header">历史介绍</span>中央文化部电影局表演艺术研究所旧址位于西四北五条，旧名石老娘胡同，是北京电影学院的前身。院落原为民国时期的大型四合院。研究所于1950年筹建并开学，设表演班、编剧班，1956年升格为北京电影学院后迁至小西天。\n\n<span class="section-header">电影记忆</span>严恭、陈怀恺曾在此任教，周扬、夏衍、老舍、艾青、丁玲等文化人士来院讲学。简朴的四合院教室培养了于洋、庞学勤、赵联等新中国早期电影创作者；附近洗印厂也曾承担早期电影胶片洗印工作。` },
  "S1": { title: "四条2—4号 · 如意门", audio: "", desc: `<span class="section-header">特点与历史</span>如意门是北京四合院中数量最多、最常见的宅门形式，多供商人或士民家庭使用。门洞两侧的对称如意纹饰寄托对美好生活的向往。\n\n<span class="section-header">核心形制与尺寸</span>前檐柱间砌砖墙并居中留门洞，门洞上方两侧饰如意形砖雕，又称“象鼻枭”；门口净宽约0.9—1米、净高约1.9米。\n\n<span class="section-header">木构架</span>多采用五檩硬山式，平面有四根或六根柱；两根前檐柱嵌在墙内、不露明。` },
  "S2": { title: "四条6号 · 麒麟图门墩", audio: "", desc: `<span class="section-header">点位介绍</span>麒麟浮雕门墩又称抱鼓石，是四合院大门的门枕石，用来支撑门轴、平衡大门重量。门墩上的麒麟纹样寓意祥瑞与文运兴盛，也寄托家宅平安、子弟成才的愿望。石刻历经风化，仍可见传统雕刻匠心。` },
  "B1": { title: "无问西东精酿", audio: "", desc: `西四北大街155号的精酿饮品空间，提供门楼主题特调精酿。` },
  "B2": { title: "易应茶舍", audio: "", desc: `西四北大街147号茶饮空间，可在胡同漫步途中品茶休憩。` },
  "B3": { title: "叙杯", audio: "", desc: `赵登禹路144号沿街饮品与休闲空间。` },
  "B4": { title: "无名蹄花", audio: "", desc: `赵登禹路148号附近的沿街餐饮小馆，提供蹄花等餐食。` },
  "B5": { title: "黑潮酿造", audio: "", desc: `西四北大街96—98号精酿饮品空间。` },
  "B6": { title: "大宇宙", audio: "", desc: `西四北大街116—118号的青年生活方式与休闲消费空间。` },
  "B7": { title: "紫光园", audio: "", desc: `西四北大街122号京味餐饮老字号，可品尝北京风味小吃。` },
  "B8": { title: "蝗虫精酿", audio: "", desc: `西四北大街128号社区精酿体验店。` },
  "N12": { title: "拾光茶社", audio: "", desc: `西四北三条15—19号茶饮空间，提供特调茶饮。` }
};

const missingContent = {
  title: id ? "点位档案 · 模型待补" : db.N3.title,
  audio: "",
  desc: "该点位专属的门楼模型与讲解资料尚未导入。当前仅展示占位说明，请勿将其他门楼模型视为本点位实景。"
};
const content = id ? (db[id] || missingContent) : db.N3;

// 渲染标题和文字
document.getElementById('m-title').innerHTML = content.title;
document.getElementById('m-desc').innerHTML = content.desc;

// 只播放当前点位已登记的讲解音频
const player = document.getElementById('gate-audio');
if (content.audio) player.src = content.audio;
else { player.hidden = true; }

// 六种门楼形制模型均为自包含 GLB；其他点位不复用这些模型。
const viewer = document.getElementById('gate-viewer');
const modelState = document.getElementById('model-state');
const availableModels = [
  { id: 'N3', label: '金柱大门', path: 'assets/models/jinzhu-gate/Jinzhu_Gate.glb' },
  { id: 'N39', label: '如意门', path: 'assets/models/ruyi-gate/Ruyi_Gate.glb' },
  { id: 'N2', label: '广亮大门', path: 'assets/models/guangliang-gate/Guangliang_Gate.glb' },
  { id: 'N5', label: '蛮子门', path: 'assets/models/manzi-gate/Manzi_Gate.glb' },
  { id: 'N11', label: '西洋门', path: 'assets/models/western-gate/Western_Gate.glb' },
  { id: 'N10', label: '随墙门', path: 'assets/models/suiqiang-gate/Suiqiang_Gate.glb' }
];
const modelSelect = document.getElementById('model-select');
modelSelect.innerHTML = '<option value="">选择已建模门楼</option>' + availableModels.map(model => `<option value="${model.id}">${model.label}</option>`).join('');
modelSelect.value = availableModels.some(model => model.id === id) ? id : (id ? '' : 'N3');
modelSelect.addEventListener('change', () => {
  if (modelSelect.value) location.href = `gate-3d.html?id=${encodeURIComponent(modelSelect.value)}`;
});
const selectedModel = availableModels.find(model => model.id === (id || 'N3'));
const modelPath = selectedModel && selectedModel.path;
const badge = document.querySelector('.demo-badge');
if (modelPath) {
  badge.textContent = `${selectedModel.label} · 三维模型`;
  viewer.alt = `${selectedModel.label}三维形制模型`;
  viewer.hidden = false;
  viewer.addEventListener('progress', (event) => {
    const percent = Math.round((event.detail.totalProgress || 0) * 100);
    modelState.textContent = percent ? `门楼模型加载中 ${percent}%` : '门楼模型加载中…';
  });
  viewer.addEventListener('load', () => { modelState.hidden = true; });
  viewer.addEventListener('error', () => { modelState.textContent = '模型加载失败，请检查网络或模型文件后重试。'; });
  viewer.src = modelPath;
} else {
  badge.textContent = '模型资源待补';
  modelState.textContent = '该点位的专属 3D 模型尚未提供，当前仅展示档案信息。';
}

// 返回：有来源页则回退，否则去全部景点地图
function goBack() {
  if (document.referrer && history.length > 1) history.back();
  else location.href = 'map.html?mode=free';
}
document.getElementById('back').addEventListener('click', goBack);
document.getElementById('back2').addEventListener('click', goBack);

// ===== 电子护照：浏览 / 听讲解 即可领取印章（仅记录点位编号、类型、时间，保存在本机）=====
var STAMP_NAMES = {N1:'圣祚隆长寺',N2:'马福祥故居',N12:'拾光茶社',N11:'西洋门',N3:'金柱大门',N4:'广亮大门',N39:'程砚秋故居',N5:'蛮子门',N10:'随墙门',L5:'傅增湘故居',W1:'中央电影局旧址',S1:'如意门',S2:'麒麟图门墩',S3:'广亮大门',S4:'西洋门',B3:'叙杯',B4:'无名蹄花',B5:'黑潮酿造',B6:'大宇宙',B7:'紫光园',B8:'蝗虫精酿',B2:'易应茶舍',B1:'无问西东精酿'};
function mlLoad(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function mlSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function mlRecord(type) {
  var ev = mlLoad('menlouEvents', []); ev.push({id: id, type: type, t: Date.now(), demo: 0});
  if (ev.length > 3000) ev = ev.slice(-3000); mlSave('menlouEvents', ev);
  var st = mlLoad('menlouStamps', {});
  if (!st[id]) { st[id] = {t: Date.now(), how: type}; mlSave('menlouStamps', st); stampToast(); }
}
var toastTimer;
function stampToast() {
  var el = document.getElementById('stampToast');
  if (!el) {
    el = document.createElement('div'); el.id = 'stampToast'; el.className = 'stamp-toast';
    document.body.appendChild(el);
  }
  el.innerHTML = '<span class="sq"><svg viewBox="0 0 48 48" fill="none" stroke="#E8CF8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20L24 8l18 12"/><path d="M11 20v20M37 20v20"/><path d="M17 40V24h14v16"/></svg></span><span>获得印章 <b>' + STAMP_NAMES[id] + '</b>　<a href="passport.html">去护照</a></span>';
  requestAnimationFrame(function () { el.classList.add('show'); });
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 4200);
}
if (id && STAMP_NAMES[id]) {
  setTimeout(function () { mlRecord('browse'); }, 8000);                       // 浏览满 8 秒
  var audioDone = false;
  player.addEventListener('timeupdate', function () {                          // 播放满 5 秒
    if (!audioDone && player.currentTime >= 5) { audioDone = true; mlRecord('audio'); }
  });
}
</script>
