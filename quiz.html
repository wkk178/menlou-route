<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>定制我的路线 | 门楼层记·故事里</title>
<style>
:root{--red: #B8382E; --gray: #6B5B4F; --green: #4A6B5A; --gold: #C9A86C; --cream: #F5F1E8; --ink: #2C2420; --line: rgba(107,91,79,0.14);}
*{margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
body{font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #E6DFD0; color: var(--ink);}
a{color: inherit; text-decoration: none;}
button{font-family: inherit; border: none; background: none; cursor: pointer; color: inherit;}

.app{max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--cream); position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.12);}

/* 顶部栏 */
.top{position: sticky; top: 0; z-index: 20; background: rgba(245,241,232,0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: calc(env(safe-area-inset-top) + 8px) 14px 10px;}
.top-row{display: flex; align-items: center; justify-content: space-between; height: 40px;}
.back{width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--gray); margin-left: -8px;}
.top h1{font-size: 17px; font-weight: 700; letter-spacing: 1px;}
.skip{font-size: 13px; color: var(--green); padding: 8px 0 8px 8px; min-width: 56px; text-align: right;}
.progress{display: flex; gap: 5px; margin-top: 8px;}
.progress i{flex: 1; height: 4px; border-radius: 2px; background: rgba(107,91,79,0.15); transition: background 0.3s;}
.progress i.on{background: linear-gradient(90deg, var(--red), #E0733B);}

/* 内容 */
.content{padding: 18px 16px calc(150px + env(safe-area-inset-bottom));}
.stage{animation: slideIn 0.28s ease;}
@keyframes slideIn{from{opacity: 0; transform: translateX(18px);} to{opacity: 1; transform: none;}}
.eyebrow{font-size: 12px; color: var(--red); font-weight: 700; letter-spacing: 2px;}
.q-title{font-size: 24px; line-height: 1.3; margin: 6px 0 4px; letter-spacing: 1px;}
.q-hint{font-size: 13px; color: #8a7f76; margin-bottom: 18px;}

/* 🚨 高级图标系统样式 🚨 */
.opt{display: flex; align-items: center; gap: 13px; text-align: left; width: 100%; padding: 14px; background: #fff; border: 2px solid transparent; border-radius: 16px; box-shadow: 0 3px 12px rgba(107,91,79,0.08); transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);}
.opt:active{transform: scale(0.985);}
.opt .ic{flex: 0 0 48px; height: 48px; border-radius: 14px; background: #F1EFEA; color: #8A7F76; display: flex; align-items: center; justify-content: center; transition: all 0.3s;}
.opt .ic svg{width: 26px; height: 26px; display: block;}
.opt .tx{flex: 1; min-width: 0;}
.opt .tx b{display: block; font-size: 16px; transition: color 0.3s;}
.opt .tx span{font-size: 12px; color: #8a7f76; line-height: 1.4; transition: color 0.3s;}
.opt .rd{flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid #d4cbc0; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 13px; font-weight: 700; transition: all 0.3s;}

.opt.sel{border-color: var(--red); background: #FFF7F4; box-shadow: 0 6px 16px rgba(184,56,46,0.12);}
.opt.sel .ic{background: #F6E3DF; color: var(--red);}
.opt.sel .tx b{color: var(--ink);}
.opt.sel .tx span{color: #A08C86;}
.opt.sel .rd{background: var(--red); border-color: var(--red); color: #fff;}

/* 多选：两列卡片 */
.chips{display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}
.chip{position: relative; text-align: center; padding: 20px 12px 16px; background: #fff; border: 2px solid transparent; border-radius: 16px; box-shadow: 0 3px 12px rgba(107,91,79,0.08); transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);}
.chip:active{transform: scale(0.97);}
.chip .ic{width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 16px; background: #F1EFEA; color: #8A7F76; display: flex; align-items: center; justify-content: center; transition: all 0.3s;}
.chip .ic svg{width: 28px; height: 28px; display: block;}
.chip b{display: block; font-size: 15px; margin: 0 0 4px; transition: color 0.3s;}
.chip span{display: block; font-size: 11.5px; color: #8a7f76; line-height: 1.4; transition: color 0.3s;}
.chip .ck{position: absolute; right: 12px; top: 12px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d4cbc0; color: transparent; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all 0.3s;}

.chip.sel{border-color: var(--red); background: #FFF7F4; box-shadow: 0 6px 16px rgba(184,56,46,0.12);}
.chip.sel .ic{background: #F6E3DF; color: var(--red);}
.chip.sel .ck{background: var(--red); border-color: var(--red); color: #fff;}

/* 确认摘要 */
.recap{margin-top: 18px; background: #fff; border-radius: 16px; padding: 4px 14px; box-shadow: 0 3px 12px rgba(107,91,79,0.08);}
.recap h4{font-size: 13px; color: var(--gray); padding: 10px 0 4px;}
.recap .row{display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; border-top: 1px solid var(--line);}
.recap .row span{color: #8a7f76; flex: 0 0 auto;}
.recap .row b{text-align: right; font-weight: 600;}

/* 底部操作栏及温馨提示 */
.bottom-wrapper{position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 30;}
.tips-box {background: rgba(245,241,232,0.96); padding: 10px 16px 5px; text-align: center;}
.tips-box p {font-size: 11px; color: #8a7f76; line-height: 1.5; margin-bottom: 0;}
.tips-box strong {color: var(--gray); font-size: 12px; display: block; margin-bottom: 2px;}

.bar{display: flex; align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);}
.btn-prev{flex: 0 0 auto; padding: 14px 8px; font-size: 15px; color: var(--gray);}
.btn-main{flex: 1; padding: 15px 0; border-radius: 28px; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #fff; background: linear-gradient(135deg, #A93027, #E0733B); box-shadow: 0 6px 16px rgba(184,56,46,0.32); transition: all 0.15s;}
.btn-main:active{transform: scale(0.98);}
.btn-main:disabled{background: #d9d1c7; box-shadow: none; color: #fff; cursor: not-allowed;}
</style>
</head>
<body>
<!-- 🎨 精美 SVG 矢量图标库，统一风格 -->

<div class="app">
  <header class="top">
    <div class="top-row">
      <button class="back" id="back" aria-label="返回">‹</button>
      <h1>定制我的路线</h1>
      <a class="skip" href="map.html?mode=free">自主游览</a>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <main class="content"><div class="stage" id="stage"></div></main>

  <div class="bottom-wrapper">
    <div class="tips-box">
      <strong>温馨提示：雅邻共忆</strong>
      <p>胡同更是居民的家，请轻声慢步，不外放不聚集；<br>做胡同里最温柔的过客。</p>
    </div>

    <div class="bar">
      <button class="btn-prev" id="prev">上一步</button>
      <button class="btn-main" id="next">下一步</button>
    </div>
  </div>
</div>

<script>
// 使用全新 SVG ID 映射，替换原本简陋的 Emoji
var STEPS = [
  {key: 'theme', type: 'single', title: '你更想体验什么？', hint: '选一个最感兴趣的方向',
   opts: [
    {v: 'read',   i: 'gate', t: '门楼探秘', d: '了解门楼形制与砖雕艺术'},
    {v: 'push',   i: 'courtyard', t: '院落故事', d: '走进胡同，感受老北京生活'},
    {v: 'create', i: 'modern', t: '新颜共生', d: '体验茶饮、京剧等新业态'},
    {v: 'mixed',  i: 'compass', t: '综合体验', d: '文化、故事与创新，均衡感受'}]},
  {key: 'duration', type: 'single', title: '打算逛多久？', hint: '路线会按你的时间来安排站数',
   opts: [
    {v: '60',  i: 'time1', t: '1 小时',   d: '快速精华游'},
    {v: '90',  i: 'time2', t: '1.5 小时', d: '标准深度游'},
    {v: '120', i: 'time3', t: '2 小时',   d: '全面沉浸游'},
    {v: '180', i: 'time4', t: '3 小时以上', d: '深度探索游'}]},
  {key: 'profile', type: 'single', title: '和谁一起来？', hint: '我们会据此调整推荐内容',
   opts: [
    {v: 'independent', i: 'solo', t: '独自一人',   d: '自由探索，深度体验'},
    {v: 'romantic',    i: 'couple', t: '情侣 / 伴侣', d: '浪漫漫步，拍照打卡'},
    {v: 'family',      i: 'family', t: '家庭亲子',   d: '寓教于乐，适合儿童'},
    {v: 'social',      i: 'social', t: '朋友同行',   d: '互动体验，分享乐趣'}]},
  {key: 'tags', type: 'multi', title: '还对哪些感兴趣？', hint: '可多选，至少选 1 项',
   opts: [
    {v: 'architecture', i: 'arch', t: '古建筑',   d: '门楼形制、砖雕艺术'},
    {v: 'history',      i: 'history', t: '历史人文', d: '名人故居、院落故事'},
    {v: 'food',         i: 'tea', t: '美食茶饮', d: '特色茶铺、胡同小馆'},
    {v: 'photo',        i: 'photo', t: '摄影打卡', d: '最美角度、出片之地'},
    {v: 'shopping',     i: 'shop', t: '文创购物', d: '门楼主题文创产品'}]}
];

var ans = {theme: '', duration: '', profile: '', tags: []};
var step = 0;
var $ = function (id) { return document.getElementById(id); };

function labelOf(key, v) {
  var s = STEPS.filter(function (x) { return x.key === key; })[0];
  var o = s.opts.filter(function (x) { return x.v === v; })[0];
  return o ? o.t : '';
}

function isDone(i) {
  var k = STEPS[i].key;
  return k === 'tags' ? ans.tags.length > 0 : ans[k] !== '';
}

function render() {
  var s = STEPS[step], html = '';
  $('progress').innerHTML = STEPS.map(function (_, i) { return '<i class="' + (i <= step ? 'on' : '') + '"></i>'; }).join('');

  html += '<div class="eyebrow">第 ' + (step + 1) + ' 步 / 共 ' + STEPS.length + ' 步</div>';
  html += '<h2 class="q-title">' + s.title + '</h2><p class="q-hint">' + s.hint + '</p>';

  if (s.type === 'multi') {
    html += '<div class="chips">' + s.opts.map(function (o) {
      var sel = ans.tags.indexOf(o.v) > -1;
      return '<button class="chip' + (sel ? ' sel' : '') + '" data-v="' + o.v + '"><span class="ck">✓</span><div class="ic"><svg><use href="#i-' + o.i + '"/></svg></div><b>' + o.t + '</b><span>' + o.d + '</span></button>';
    }).join('') + '</div>';
  } else {
    html += '<div class="opts">' + s.opts.map(function (o) {
      var sel = ans[s.key] === o.v;
      return '<button class="opt' + (sel ? ' sel' : '') + '" data-v="' + o.v + '"><span class="ic"><svg><use href="#i-' + o.i + '"/></svg></span><span class="tx"><b>' + o.t + '</b><span>' + o.d + '</span></span><span class="rd">✓</span></button>';
    }).join('') + '</div>';
  }

  if (step === STEPS.length - 1) {
    html += '<div class="recap"><h4>你的选择</h4>' +
      '<div class="row"><span>体验方向</span><b>' + labelOf('theme', ans.theme) + '</b></div>' +
      '<div class="row"><span>游览时长</span><b>' + labelOf('duration', ans.duration) + '</b></div>' +
      '<div class="row"><span>同行人员</span><b>' + labelOf('profile', ans.profile) + '</b></div>' +
      '<div class="row"><span>兴趣内容</span><b>' + ans.tags.map(function (t) { return labelOf('tags', t); }).join('、') + '</b></div></div>';
  }

  var stage = $('stage');
  stage.style.animation = 'none'; void stage.offsetWidth; stage.style.animation = '';
  stage.innerHTML = html;
  stage.querySelectorAll('[data-v]').forEach(function (el) {
    el.addEventListener('click', function () { choose(el.getAttribute('data-v')); });
  });

  $('prev').style.display = step === 0 ? 'none' : 'block';
  updateMain();
  window.scrollTo(0, 0);
}

function updateMain() {
  var btn = $('next'), last = step === STEPS.length - 1;
  btn.disabled = !isDone(step);
  if (last) btn.textContent = '生成我的路线';
  else if (STEPS[step].type === 'multi' && ans.tags.length) btn.textContent = '下一步（已选 ' + ans.tags.length + ' 项）';
  else btn.textContent = '下一步';
}

function choose(v) {
  var s = STEPS[step];
  if (s.type === 'multi') {
    var i = ans.tags.indexOf(v);
    if (i > -1) ans.tags.splice(i, 1); else ans.tags.push(v);
    document.querySelectorAll('.chip').forEach(function (el) { el.classList.toggle('sel', ans.tags.indexOf(el.getAttribute('data-v')) > -1); });
    updateMain();
    return;
  }
  ans[s.key] = v;
  document.querySelectorAll('.opt').forEach(function (el) { el.classList.toggle('sel', el.getAttribute('data-v') === v); });
  updateMain();
  if (step < STEPS.length - 1 && STEPS[step].type === 'single') {
    setTimeout(function () { step++; render(); }, 220);
  }
}

function goNext() {
  if (!isDone(step)) return;
  if (step < STEPS.length - 1) { step++; render(); return; }
  submit();
}

function goBack() {
  if (step > 0) { step--; render(); } else { location.href = 'choose.html'; }
}

function submit() {
  $('next').disabled = true;
  $('next').textContent = '正在规划路线…';

  var preset = '4'; // 默认全景大环线
  if (ans.theme === 'read') preset = '1';
  else if (ans.theme === 'push') preset = '2';
  else if (ans.theme === 'create') preset = ans.tags.indexOf('food') > -1 && ans.tags.indexOf('shopping') === -1 ? '5' : '3';
  else if (ans.theme === 'mixed') preset = '4';

  if (parseInt(ans.duration) >= 180) preset = '4'; // 时间长直接给大环线

  var q = new URLSearchParams({ preset: preset });
  location.href = 'map.html?' + q.toString();
}

$('next').addEventListener('click', goNext);
$('prev').addEventListener('click', goBack);
